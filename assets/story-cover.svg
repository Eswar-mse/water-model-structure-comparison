<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">4AKE in water: a visual map of eight molecular dynamics trajectories</title>
  <desc id="desc">Four water models compared for crystal and predicted starting structures. A chart shows mean NMP to core distance in angstroms for each condition.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091426"/><stop offset="1" stop-color="#152943"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#57e3c0"/><stop offset="1" stop-color="#80b8ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#030914" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="560" fill="url(#bg)"/>
  <circle cx="112" cy="494" r="240" fill="#57e3c0" opacity=".045"/>
  <circle cx="1010" cy="50" r="255" fill="#80b8ff" opacity=".055"/>
  <path d="M0 483 Q210 415 397 503 T800 482 T1200 490" fill="none" stroke="#6dbbd9" opacity=".12" stroke-width="2"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="58" y="54" width="178" height="30" rx="15" fill="#193c49" stroke="#3a7c82"/>
    <text x="147" y="75" text-anchor="middle" fill="#8de6d2" font-size="13" font-weight="700" letter-spacing="1.8">4AKE · 8 TRAJECTORIES</text>
    <text x="58" y="159" fill="#ffffff" font-size="53" font-weight="760" letter-spacing="-2">The protein moves.</text>
    <text x="58" y="222" fill="#80e1c8" font-size="53" font-weight="760" letter-spacing="-2">The water matters.</text>
    <text x="59" y="273" fill="#c0ccdb" font-size="19">A visual study of crystal- and predicted-start</text>
    <text x="59" y="302" fill="#c0ccdb" font-size="19">adenylate kinase in four explicit-water models.</text>
    <path d="M60 349 H486" stroke="url(#line)" stroke-width="2" opacity=".6"/>
    <text x="59" y="383" fill="#d6e7ef" font-size="16" font-weight="600">4 water models</text>
    <text x="59" y="412" fill="#9fb5c9" font-size="15">OPC · SPC/E · TIP3P · TIP4P</text>
    <text x="59" y="458" fill="#d6e7ef" font-size="16" font-weight="600">2 starting structures</text>
    <text x="59" y="487" fill="#9fb5c9" font-size="15">4AKE crystal · predicted structure</text>
    <rect x="550" y="52" width="596" height="455" rx="24" fill="#1c3049" stroke="#39506a" filter="url(#shadow)"/>
    <text x="584" y="91" fill="#ffffff" font-size="20" font-weight="700">NMP domain opening</text>
    <text x="584" y="117" fill="#acc0d3" font-size="13">Mean NMP–core distance (Å) · descriptive trajectory means</text>
    <circle cx="595" cy="148" r="6" fill="#54d9b6"/><text x="610" y="153" fill="#c8d9e5" font-size="13">Crystal start</text>
    <circle cx="737" cy="148" r="6" fill="#ffb471"/><text x="752" y="153" fill="#c8d9e5" font-size="13">Predicted start</text>
    <g stroke="#456078" stroke-width="1">
      <path d="M720 184 V444 M840 184 V444 M960 184 V444 M1080 184 V444" opacity=".65"/>
    </g>
    <g fill="#96abc0" font-size="12"><text x="710" y="465">35</text><text x="830" y="465">40</text><text x="950" y="465">45</text><text x="1070" y="465">50 Å</text></g>
    <g font-size="16" font-weight="700" fill="#edf5fb"><text x="585" y="217">OPC</text><text x="585" y="283">SPC/E</text><text x="585" y="349">TIP3P</text><text x="585" y="415">TIP4P</text></g>
    <g stroke-width="5" stroke-linecap="round">
      <path d="M881.4 211 H938.3" stroke="#79a7a4"/><path d="M876.5 277 H926.1" stroke="#79a7a4"/>
      <path d="M846.4 343 H944.6" stroke="#79a7a4"/><path d="M954.9 409 H956.5" stroke="#79a7a4"/>
    </g>
    <g fill="#54d9b6" stroke="#1c3049" stroke-width="3"><circle cx="938.3" cy="211" r="9"/><circle cx="926.1" cy="277" r="9"/><circle cx="846.4" cy="343" r="9"/><circle cx="954.9" cy="409" r="9"/></g>
    <g fill="#ffb471" stroke="#1c3049" stroke-width="3"><circle cx="881.4" cy="211" r="9"/><circle cx="876.5" cy="277" r="9"/><circle cx="944.6" cy="343" r="9"/><circle cx="956.5" cy="409" r="9"/></g>
    <g fill="#e2edf6" font-size="13" font-weight="600">
      <text x="974" y="216">44.09 / 41.73</text><text x="974" y="282">43.59 / 41.52</text>
      <text x="974" y="348">40.27 / 44.36</text><text x="974" y="414">44.79 / 44.85</text>
    </g>
    <text x="583" y="489" fill="#8fa8be" font-size="12">Source: domain_distance_summary.csv · crystal / predicted</text>
  </g>
</svg>
