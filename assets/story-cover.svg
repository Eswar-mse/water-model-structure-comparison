<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Water models and starting structures: a visual comparison of protein motion</title>
  <desc id="desc">Four water models compared for crystal and predicted starting structures. A chart shows mean NMP to core distance in angstroms for each condition.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090b10"/><stop offset="1" stop-color="#17131a"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff5b68"/><stop offset="1" stop-color="#77c9f0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#030914" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="560" fill="url(#bg)"/>
  <circle cx="112" cy="494" r="240" fill="#ff5b68" opacity=".045"/>
  <circle cx="1010" cy="50" r="255" fill="#77c9f0" opacity=".055"/>
  <path d="M0 483 Q210 415 397 503 T800 482 T1200 490" fill="none" stroke="#ff5b68" opacity=".12" stroke-width="2"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="58" y="54" width="178" height="30" rx="15" fill="#30191e" stroke="#87303e"/>
    <text x="147" y="75" text-anchor="middle" fill="#ff9ea6" font-size="13" font-weight="700" letter-spacing="1.8">4 × 2 COMPARISON</text>
    <text x="58" y="159" fill="#ffffff" font-size="51" font-weight="760" letter-spacing="-2">Change the water.</text>
    <text x="58" y="222" fill="#ff6b76" font-size="51" font-weight="760" letter-spacing="-2">Change the start.</text>
    <text x="59" y="273" fill="#c6c9d1" font-size="19">How do both choices shape the motions</text>
    <text x="59" y="302" fill="#c6c9d1" font-size="19">sampled by a protein? A 4AKE case study.</text>
    <path d="M60 349 H486" stroke="url(#line)" stroke-width="2" opacity=".6"/>
    <text x="59" y="383" fill="#f0f1f5" font-size="16" font-weight="600">4 water models</text>
    <text x="59" y="412" fill="#aab2c0" font-size="15">OPC · SPC/E · TIP3P · TIP4P</text>
    <text x="59" y="458" fill="#f0f1f5" font-size="16" font-weight="600">2 starting structures</text>
    <text x="59" y="487" fill="#aab2c0" font-size="15">4AKE crystal · predicted structure</text>
    <rect x="550" y="52" width="596" height="455" rx="24" fill="#171b25" stroke="#414857" filter="url(#shadow)"/>
    <text x="584" y="91" fill="#ffffff" font-size="20" font-weight="700">NMP domain opening</text>
    <text x="584" y="117" fill="#b7bfcc" font-size="13">Mean NMP–core distance (Å) · descriptive trajectory means</text>
    <circle cx="595" cy="148" r="6" fill="#ff5b68"/><text x="610" y="153" fill="#d1d6df" font-size="13">Crystal start</text>
    <circle cx="737" cy="148" r="6" fill="#77c9f0"/><text x="752" y="153" fill="#d1d6df" font-size="13">Predicted start</text>
    <g stroke="#414857" stroke-width="1">
      <path d="M720 184 V444 M840 184 V444 M960 184 V444 M1080 184 V444" opacity=".65"/>
    </g>
    <g fill="#aeb8c8" font-size="12"><text x="710" y="465">35</text><text x="830" y="465">40</text><text x="950" y="465">45</text><text x="1070" y="465">50 Å</text></g>
    <g font-size="16" font-weight="700" fill="#f3f5f8"><text x="585" y="217">OPC</text><text x="585" y="283">SPC/E</text><text x="585" y="349">TIP3P</text><text x="585" y="415">TIP4P</text></g>
    <g stroke-width="5" stroke-linecap="round">
      <path d="M881.4 211 H938.3" stroke="#7f8797"/><path d="M876.5 277 H926.1" stroke="#7f8797"/>
      <path d="M846.4 343 H944.6" stroke="#7f8797"/><path d="M954.9 409 H956.5" stroke="#7f8797"/>
    </g>
    <g fill="#ff5b68" stroke="#171b25" stroke-width="3"><circle cx="938.3" cy="211" r="9"/><circle cx="926.1" cy="277" r="9"/><circle cx="846.4" cy="343" r="9"/><circle cx="954.9" cy="409" r="9"/></g>
    <g fill="#77c9f0" stroke="#171b25" stroke-width="3"><circle cx="881.4" cy="211" r="9"/><circle cx="876.5" cy="277" r="9"/><circle cx="944.6" cy="343" r="9"/><circle cx="956.5" cy="409" r="9"/></g>
    <g fill="#e4e8ef" font-size="13" font-weight="600">
      <text x="974" y="216">44.09 / 41.73</text><text x="974" y="282">43.59 / 41.52</text>
      <text x="974" y="348">40.27 / 44.36</text><text x="974" y="414">44.79 / 44.85</text>
    </g>
    <text x="583" y="489" fill="#a7afbd" font-size="12">Source: domain_distance_summary.csv · crystal / predicted</text>
  </g>
</svg>
